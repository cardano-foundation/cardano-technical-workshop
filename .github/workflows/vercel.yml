name: Deploy Workbench to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: vercel
      url: ${{ steps.deploy.outputs.url }}
    concurrency:
      group: vercel-production
      cancel-in-progress: false
    env:
      VERCEL_CLI_VERSION: "65.15.0"
      VERCEL_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check production branch and credentials
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo "::error::Production deployments require main."
            exit 1
          fi
          for variable in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [[ -z "${!variable}" ]]; then
              echo "::error::$variable is missing from the vercel environment."
              exit 1
            fi
          done
      - name: Checkout sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Ensure safe browser-test cleanup is available
        run: |
          if ! command -v gio; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends libglib2.0-bin
          fi
      - name: Check transaction logic and UI state
        run: npm test
      - name: Build and smoke-test both modes without live transactions
        run: npm run test:browser:isolated
      - name: Package only the tested static build
        run: |
          test -f dist-static/index.html
          test ! -e .vercel/output
          mkdir -p .vercel/output
          cp -R dist-static .vercel/output/static
          printf '%s\n' '{"version":3}' > .vercel/output/config.json
      - name: Install the pinned deployment CLI
        run: npm install --global "vercel@$VERCEL_CLI_VERSION"
      - name: Deploy the tested artifact to production
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          vercel deploy --prebuilt --prod --yes --token "$VERCEL_TOKEN" > "$RUNNER_TEMP/vercel-url.txt"
          url="$(cat "$RUNNER_TEMP/vercel-url.txt")"
          printf 'url=%s\n' "$url" >> "$GITHUB_OUTPUT"
          printf '### Vercel production\n\nURL: %s\n\nSource: %s\n' \
            "$url" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
